<!DOCTYPE html>

<html lang="en">
    <head>

        <!-- Metadata -->
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
        <meta name="description" content="website"/>
        <meta name="author" content="Parinya Punpongsanon"/>
        <title>{{ site.title }} | {{ site.info }}</title>
        <link rel="icon" type="image/x-icon" href="{{ site.icon-pic }}"/>
        
        <!-- Font Awesome icons -->
        <script src="https://use.fontawesome.com/releases/v7.2.0/js/all.js"></script>
		
		<!-- Hugeicon -->
		<link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
		
        <!-- Google fonts-->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">        
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <link href="https://fonts.googleapis.com/css?family=Saira+Extra+Condensed:500,700" rel="stylesheet" type="text/css"/>
        <link href="https://fonts.googleapis.com/css?family=Muli:400,400i,800,800i" rel="stylesheet" type="text/css"/>
        <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">


        <!-- Core theme CSS -->
        <link href="styles/styles.css" rel="stylesheet"/>

    </head>

    <body>

        <!-- Moving particles -->
        <canvas id="canvas"></canvas>

        <!-- Progress bar on top -->
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Back to top button -->
        <a id="back-to-top-button"></a>

        <!-- Toggle dark/light theme button -->
        <button class="toggle-theme-button" onclick="toggleTheme()">☀️</button>
        
        <!-- Assitant icon saying about theme changes -->
        <div class="popup-icon-container" id="popupIconContainer" draggable="true">
            <div class="icon"><img src="{{ site.icon-pic }}" width="65" height="65"></div>
            <div class="speech-balloon"></div>
        </div>
        
        <!-- Dismissal area for assistant icon -->
        <div class="dismissal-area" id="dismissalArea">&#10006;</div>

        <!-- Navigation bar -->
        <!-- Fusion of jQuery slidebar (https://codepen.io/BeshoyRomany/pen/qmNPwN) and animated hamburger menu (https://codepen.io/amberweinberg/pen/yeqJgG) -->
        <nav>
            <a class="nav-toggle-btn" onclick="toggleNav()">
                <span></span>
                <span></span>
                <span></span>
            </a>
            <ul>
                <li><p onclick="scrollToTopDiv('html')"><i class="hgi hgi-stroke hgi-home-09"></i> <span class="text">home</span></p></li>
				<!--<li><p onclick="scrollToTopDiv('#updates')"><span class="emoji">📜</span> <span class="text">updates</span></p></li>-->
                <li><p onclick="scrollToTopDiv('#research')"><i class="fa-solid fa-book"></i> <span class="text">researches</span></p></li>
                <li><p onclick="scrollToTopDiv('#publication')"><i class="fa-brands fa-firstdraft"></i> <span class="text">publications</span></p></li>
                <li><p onclick="scrollToTopDiv('#resources')"><i class="hgi hgi-stroke hgi-teacher"></i> <span class="text">teaching</span></p></li>
                <li><p onclick="scrollToTopDiv('#gallery')"><i class="hgi hgi-stroke hgi-school-tie"></i> <span class="text">activities</span></p></li>
            </ul>
        </nav>

        <!-- Content -->
        <div class="container" style="padding-top: 3rem;">
            {{ content }}
        </div>

        <!-- Bootstrap core JS-->
        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Isotope JS -->
        <script src="https://cdn.jsdelivr.net/npm/isotope-layout@3.0.2/dist/isotope.pkgd.min.js"></script>

        <!-- OwlCarousel2 JS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>

        <!-- Axios JS -->
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

		<!-- Third party plugin JS-->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

		<!-- Core theme JS-->
        <script src="js/scripts.js"></script>

    </body>
</html>
