  - title: Reconfigurable Soft Pneumatic Actuators Using Multi-Material Self-Healing Polymers
    system-name: 
    gif: assets/research/RAL_2025_Ishizuka.png
    conference: IEEE Robotics and Automation Letters, (Presented at IROS 2025)
    conference-web: https://iros25.org/zzjg
    status:
    authors: Shota Kosaka, Kentaro Kimura, Seiichi Yamamoto, Hiroki Ishizuka, Yoichi Masuda, <u>Parinya Punpongsanon</u>, Sei Ikeda, Osamu Oshiro.
    doi: https://doi.org/10.1109/LRA.2025.3554971
    pdf: https://www.dropbox.com/scl/fi/e9o8lfbbxwrrvvrw0ah5l/RAL_2025_Ishizuka.pdf?rlkey=hf2ncw98rsz9tgoxlb6l0tphy&st=4qisvghj&dl=0
    code: 
    demo: 
    slides: 
    talk: 
    poster:
    project-web:    
    abstract-less: Reconstructing three-dimensional (3D) scenes with semantic understanding is vital in many robotic applications. Robots need to identify which objects, along with their positions and shapes, to manipulate them precisely with given tasks. Mobile robots, especially, usually use lightweight networks to segment objects on RGB images and then localize them via depth maps; however, they 
    abstract-more: often encounter out-of-distribution scenarios where masks over-cover the objects. In this paper, we address the problem of panoptic segmentation quality in 3D scene reconstruction by refining segmentation errors using non-parametric statistical methods. To enhance mask precision, we map the predicted masks into a depth frame to estimate their distribution via kernel densities. The outliers in depth perception are then rejected without the need for additional parameters in an adaptive manner to out-of-distribution scenarios, followed by 3D reconstruction using projective signed distance functions (SDFs). We validate our method on a synthetic dataset, which shows improvements in both quantitative and qualitative results for panoptic mapping. Through real-world testing, the results furthermore show our method's capability to be deployed on a real-robot system.
    tag: 
    category: digital fabrication
    
  - title: Unobtrusive Edible Tags using Food 3D Printing
    system-name: 
    gif: assets/research/FNUT_2025_eatarytag.png
    conference: Frontiers in Nutrition, and ACM UIST 2022
    conference-web: 
    status:
    authors: Yamato Miyatake, <u>Parinya Punpongsanon</u>.
    doi: https://doi.org/10.3389/fnut.2025.1641849
    pdf: https://www.dropbox.com/scl/fi/j1u7a6tfrinq8u8uj2m28/FNUT_2025_eatarytag.pdf
    code: 
    demo: 
    slides: 
    talk: 
    poster:
    project-web: https://fip.ics.saitama-u.ac.jp/pubs/eaterytag/
    abstract-less: Human-Food Interaction (HFI) examines how digital integration can enhance dining experiences, with food tagging playing a crucial role in connecting physical dining environments with digital information. Attaching optical tags to the surface or sides of food often detracts from its aesthetics, negatively impacting the perceived taste and overall dining experience. To address this issue, 
    abstract-more: we propose an unobtrusive food tagging approach that embeds tags inside the food, maintaining both its visual appeal and sensory qualities. We first developed a tagging method using a 3D printer and proposed an end-to-end pipeline for embedding and retrieving the tags. We evaluated this method in terms of tag detectability, concealability, and the eating experience. Additionally, we developed tagging methods using molding and stamping to extend acceptability to the traditional cooking environment. Through a workshop with three home chefs, we found that these methods are accessible and easy to adopt for novice users. Our findings demonstrate the potential of embedded food tagging to integrate digital information into the dining experience without compromising culinary integrity. This approach offers new directions for HFI research and practical applications.
    tag: 
    category: digital fabrication
    
  - title: AI-generated characters for supporting personalized learning and well-being
    system-name: 
    gif: assets/research/NATMI_2021_Pataranutaporn.gif
    conference: Nature Machine Intelligence
    conference-web: 
    status:
    authors: Pat Pataranutaporn, Valdemar Danry, Joanne Leong, <u>Parinya Punpongsanon</u>, Dan Novy, Pattie Maes, Misha Sra.
    doi: https://doi.org/10.1038/s42256-021-00417-9
    pdf: https://www.dropbox.com/scl/fi/j8b49tmah3znwm2ym8mao/NATMI_2021_Pataranutaporn.pdf?rlkey=jwho4g59dvg3vv25szutxgf0z&st=s1ja8uvg&dl=0
    code: 
    demo: 
    slides: 
    talk: 
    poster:
    project-web: https://www.media.mit.edu/projects/Ai-generated-characters/overview/
    abstract-less: Advancements in machine learning have recently enabled the hyper-realistic synthesis of prose, images, audio and video data, in what is referred to as artificial intelligence (AI)-generated media. These techniques offer novel opportunities for creating interactions with digital portrayals of individuals that can inspire and intrigue us. AI-generated portrayals of characters can
    abstract-more:  feature synthesized faces, bodies and voices of anyone, from a fictional character to a historical figure, or even a deceased family member. Although negative use cases of this technology have dominated the conversation so far, in this Perspective we highlight emerging positive use cases of AI-generated characters, specifically in supporting learning and well-being. We demonstrate an easy-to-use AI character generation pipeline to enable such outcomes and discuss ethical implications as well as the need for including traceability to help maintain trust in the generated media. As we look towards the future, we foresee generative media as a crucial part of the ever growing landscape of human–AI interaction.
    tag: 
    category: human perception
    
  - title: Enhancing Asynchronous Shared-Space Demonstrations with Spatial-temporal Assistive Toolsets for Effective Learning in Immersive Virtual Laboratories
    system-name: 
    gif: assets/research/CSCW_2022_Thanyadit.png
    conference: ACM CSCW 2022 (Published at ACM PHCI 2022)
    conference-web: https://cscw.acm.org/2022/
    status:
    authors: Santawat Thanyadit, <u>Parinya Punpongsanon</u>, Thammathip Piumsomboon, Ting-Chuen Pong.
    doi: https://doi.org/10.1145/3512983
    pdf: https://www.dropbox.com/s/t8iino9xfnhte4r/CSCW_2022_XRLIVE_thanyadit.pdf?dl=0
    code: 
    demo: 
    slides: 
    talk: 
    poster:
    project-web: 
    abstract-less: An immersive virtual laboratory (VL) could offer flexibility of time and space, as well as safety, for remote students to conduct laboratory activities through online experiential learning. Recording an instructor's demonstration inside a VL is an approach that allows students to learn directly from a demonstration. However, students have to learn from a recording while controlling the playback, 
    abstract-more:  which requires attention spent on additional spatial and temporal cues. This additional cognitive load could lead to errors during the laboratory procedure. To address these challenges, we have identified four design requirements to reduce attention load in VLs; namely, organized learning steps, improved student sense of co-presence, reduction of task-instructor split-attention, and learning independent of interpersonal distance. Based on these requirements, we have designed and implemented spatial-temporal assistive toolsets for laboratories in a virtual environment, namely XR-LIVE, to reduce cognitive load and enhance learning in an asynchronous shared-space demonstration, implemented based on the setup of a standard civil engineering laboratory. We also analyzed students' behavior in the VL demonstration to design guidelines applicable to generic VLs.
    tag: 
    category: xR
    
  - title: SoftPrint&#58; Investigating Haptic Softness Perception of 3D Printed Soft Object in FDM 3D Printers
    system-name: 
    gif: assets/research/JIST_2021_SoftPrint.png
    conference: Journal of Imaging Science and Technology
    conference-web: https://www.imaging.org/IST/IST/Publications/Journal_of_Imaging_Science_and_Technology.aspx
    status:
    authors: Motoki Miyoshi, <u>Parinya Punpongsanon</u>, Daisuke Iwai, Kosuke Sato.
    doi: https://doi.org/10.2352/J.ImagingSci.Technol.2021.65.4.040406
    pdf: https://www.dropbox.com/s/4fm4p1b6kmwkkk6/JIST_2021_SoftPrint_miyoshi_preprint.pdf?dl=0
    code: 
    demo: 
    slides: 
    talk: 
    poster:
    project-web: 
    abstract-less: FDM 3D printers allow massive creativity in personal products, but their potential has been limited due to inability to manipulating material properties. Previous work had demonstrated that the desired roughness could be presented simply by controlling the spatial density of tiny pins on a printed surface. This article offers a means of providing the desired softness perception of a printed 
    abstract-more:  surface and the desired roughness to expand the haptic dimension over which a user can exert control. Specifically, we control the softness by manipulating the infill structures of a printed surface. However, it is known that a skin contact area affects softness perception. The roughness, which is controlled by pins’ density, may also affect the perceived softness of a printed surface. Therefore, we investigate how the internal structures and the density of the pins affect softness perception. Through psychophysical experiments, we derive a computational model that estimates the perceived softness from the density of the pins and the infill density of a printed surface.
    tag: 
    category: digital fabrication
    
  - title: Wearable Sanitizer&#58; Design and Implementation of an Open-source, On-body Sanitizer for a Post-Pandemic
    system-name: 
    gif: assets/research/SA_2020_WearableSanitizer.png
    conference: ACM SIGGRAPH Asia 2020 (Emerging Technologies)
    conference-web: https://dl.acm.org/doi/proceedings/10.1145/3415255
    status:
    authors: Pat Pataranutaporn, Ali Shtarbanov, Glenn Fernandes, Jingwen Li, <u>Parinya Punpongsanon</u>, Joe Paradiso, Pattie Maes.
    doi: https://dl.acm.org/doi/10.1145/3415255.3422897
    pdf: https://www.dropbox.com/s/gs5ecte3wbvye3r/SA_2020_WearableSanitizer_pat.pdf?dl=0
    code: 
    demo: 
    slides: 
    talk: 
    poster:
    project-web: https://www.media.mit.edu/projects/wearable-sanitizer/overview/
    abstract-less: Regular disinfection of hands and frequently touched surfaces is a critical factor in preventing the spread of infectious diseases and disorders ranging from the common cold and flu to SARS and COVID-19. This activity of frequent disinfection requires a high degree of discipline and leads to increased cognitive and physical effort involved in frequent washing of hands, or the use of a pocket
    abstract-more:  sanitizer. We present an open-source, wearable sanitizer that provides just-in-time, automatic dispensing of alcohol to the wearer’s hand or nearby objects using sensors and programmable cues. We systematically explore the design space for wearable sanitizers aiming to create a device that not only seamlessly integrates with the user’s body and behavior but also frees their physical and mental faculties for other tasks. With these insights, we demonstrate our prototype and present the design process, device characterization, and our efforts for open-sourcing this project.
    tag: 
    category: digital fabrication