<div class="row">
	<div class="col-sm-2">
		<img class="img-fluid" src="{{ employment_list.logo }}" alt="{{ employment_list.place }}">
	</div>
	<div class="col-sm-10">
		<span class="font-weight-bold">{{ employment_list.position }}</span>
		<br>
		<i><a href="{{ employment_list.url }}" target="_blank" rel="noopener">{{ employment_list.place }}</a></i>
		<br>
		{{ employment_list.from }} <i class="fa-solid fa-angle-right"></i> {{ employment_list.to }}
		<br>
		{{ employment_list.desc }}
		<p></p>
	</div>
</div>
